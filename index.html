<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contador de Tapa Fugas</title>
<style>
  :root{--bg:#0b1220;--card:#141d33;--line:#26324f;--txt:#eef2fb;--mut:#93a0bd;--acc:#ffd92e;--blue:#3b6bff;--red:#ff5d5d;--ok:#3ddc97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 14px 40px;max-width:560px;margin-inline:auto}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:.3px}
  h1 span{color:var(--acc)}
  .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .total{background:linear-gradient(135deg,#1b2a55,#141d33);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .total b{font-size:38px;color:var(--acc);font-variant-numeric:tabular-nums}
  .total small{color:var(--mut);display:block;font-size:13px}
  button{font:inherit;color:inherit;border:0;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.97)}
  .scan{width:100%;background:var(--acc);color:#111;font-weight:700;font-size:18px;padding:16px;display:block;text-align:center;border-radius:14px}
  .row{display:flex;gap:8px;margin-top:10px}
  input[type=text],input[type=number]{flex:1;min-width:0;background:#0e1629;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font:inherit}
  .btn{background:var(--blue);padding:12px 16px;font-weight:600}
  .ghost{background:#1c2744;padding:10px 14px;font-size:14px}
  #msg{min-height:22px;margin:10px 2px;font-size:14px;color:var(--mut)}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--red)}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
  .item.flash{border-color:var(--acc);box-shadow:0 0 0 2px #ffd92e44}
  .name{font-weight:600}
  .code{color:var(--mut);font-size:13px;font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .ctl{display:flex;align-items:center;gap:8px;margin-top:12px}
  .ctl button.pm{width:56px;height:52px;font-size:26px;font-weight:700;background:#1c2744}
  .ctl button.plus{background:var(--blue)}
  .ctl input{text-align:center;font-size:24px;font-weight:700;padding:8px;font-variant-numeric:tabular-nums}
  .mini{display:flex;gap:8px;margin-top:10px}
  .mini button{background:none;color:var(--mut);font-size:13px;padding:4px 2px;text-decoration:underline}
  .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .note{color:var(--mut);font-size:12px;margin-top:14px}
  #newBox{display:none;background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:14px;margin-top:10px}
  .empty{color:var(--mut);text-align:center;padding:24px 0}
</style>
</head>
<body>
<h1>Contador de <span>Tapa Fugas</span></h1>
<div class="sub">Deixe a câmera aberta e mostre o código: cada vez que aparece conta 1</div>

<div class="total"><div><small>Total em estoque</small><span id="kinds"></span></div><b id="total">0</b></div>

<div id="camWrap" style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3">
  <video id="vid" playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video>
  <div style="position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--red);box-shadow:0 0 8px var(--red)"></div>
  <div id="hit" style="position:absolute;inset:0;border:6px solid var(--ok);border-radius:16px;opacity:0;transition:opacity .15s"></div>
  <button id="start" class="scan" style="position:absolute;left:10%;right:10%;top:38%;width:80%">📷 Abrir câmera</button>
</div>
<div class="row">
  <input id="manual" type="text" inputmode="numeric" placeholder="ou digite o código" autocomplete="off">
  <button class="btn" id="addManual">+1</button>
</div>
<div id="msg"></div>

<div id="newBox">
  <div class="name">Código novo: <span id="newCode" class="code"></span></div>
  <div class="row">
    <input id="newName" type="text" placeholder="Nome do produto">
    <button class="btn" id="saveNew">Salvar</button>
  </div>
  <div class="mini"><button id="cancelNew">Cancelar</button></div>
</div>

<div id="list"></div>

<div class="foot">
  <button class="ghost" id="copy">📋 Copiar resumo</button>
  <button class="ghost" id="reset">Zerar contagens</button>
</div>
<div class="note">A contagem fica salva neste aparelho/navegador. Use "Copiar resumo" para mandar no WhatsApp.</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const KEY='tapafugas-contagem-v1';
const DEFAULTS={'7898930424231':{name:'Tapa Fugas F5 Super 8ml (com mangueira)',qty:0}};
let items={}, mem=false, flash=null, pending=null, resetArmed=false;

function load(){
  try{const s=localStorage.getItem(KEY); items=s?JSON.parse(s):null;}catch(e){mem=true;}
  if(!items||typeof items!=='object') items=JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){mem=true;}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function say(t,cls){const m=$('msg');m.textContent=t;m.className=cls||'';}

function render(){
  const codes=Object.keys(items);
  let total=0; codes.forEach(c=>total+=items[c].qty);
  $('total').textContent=total;
  $('kinds').textContent=codes.length+(codes.length===1?' produto':' produtos');
  $('list').innerHTML=codes.length?codes.map(c=>{const it=items[c];return `
    <div class="item ${flash===c?'flash':''}" data-code="${esc(c)}">
      <div class="name">${esc(it.name)}</div>
      <div class="code">${esc(c)}</div>
      <div class="ctl">
        <button class="pm" data-a="minus">−</button>
        <input type="number" inputmode="numeric" min="0" value="${it.qty}" data-a="qty">
        <button class="pm plus" data-a="plus">+</button>
      </div>
      <div class="mini"><button data-a="del">Remover produto</button></div>
    </div>`}).join(''):'<div class="empty">Nenhum produto. Leia um código para começar.</div>';
}

function addCode(code){
  code=String(code).replace(/\D/g,'');
  if(code.length<6){say('Código inválido.','err');return;}
  if(items[code]){
    items[code].qty++; flash=code; save(); render();
    say('+1 em '+items[code].name+' → '+items[code].qty,'ok');
    setTimeout(()=>{flash=null;const el=document.querySelector('.flash');if(el)el.classList.remove('flash');},1200);
  }else{
    pending=code; $('newCode').textContent=code; $('newName').value=''; $('newBox').style.display='block'; $('newName').focus();
    say('Código ainda não cadastrado — dê um nome.','');
  }
}

$('list').addEventListener('click',e=>{
  const a=e.target.dataset.a; if(!a) return;
  const code=e.target.closest('.item').dataset.code, it=items[code]; if(!it) return;
  if(a==='plus') it.qty++;
  else if(a==='minus') it.qty=Math.max(0,it.qty-1);
  else if(a==='del'){
    if(e.target.dataset.sure){delete items[code];}
    else{e.target.dataset.sure='1';e.target.textContent='Toque de novo para remover';e.target.style.color='var(--red)';return;}
  } else return;
  save(); render();
});
$('list').addEventListener('change',e=>{
  if(e.target.dataset.a!=='qty') return;
  const code=e.target.closest('.item').dataset.code;
  items[code].qty=Math.max(0,parseInt(e.target.value,10)||0); save(); render();
});

$('addManual').onclick=()=>{const v=$('manual').value; if(v.trim()){addCode(v); $('manual').value='';}};
$('manual').addEventListener('keydown',e=>{if(e.key==='Enter')$('addManual').click();});
$('saveNew').onclick=()=>{
  if(!pending) return;
  items[pending]={name:$('newName').value.trim()||('Produto '+pending),qty:1};
  flash=pending; pending=null; $('newBox').style.display='none'; save(); render(); say('Produto cadastrado com 1 unidade.','ok');
};
$('cancelNew').onclick=()=>{pending=null;$('newBox').style.display='none';say('');};

// Câmera ao vivo
let actx=null,lastCode=null,lastSeen=0,det=null;
const GAP=1200; // ms sem ver o código para poder contar de novo
function beep(ok){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=ok?1200:500;g.gain.value=.2;
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.09);}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(50);}catch(e){}
}
function seen(code){
  const now=Date.now();
  if(code===lastCode&&now-lastSeen<GAP){lastSeen=now;return;}
  lastCode=code;lastSeen=now;
  if(pending) return;
  const known=!!items[code.replace(/\D/g,'')];
  addCode(code);beep(known);
  const h=$('hit');h.style.opacity=1;setTimeout(()=>h.style.opacity=0,250);
}
async function loopNative(){
  const v=$('vid');
  if(v.readyState>=2){try{const r=await det.detect(v);if(r.length)seen(r[0].rawValue);}catch(e){}}
  setTimeout(loopNative,120);
}
async function startCam(){
  $('start').style.display='none';
  try{
    if(!navigator.mediaDevices) throw new Error('nocam');
    if('BarcodeDetector' in window){
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
      const v=$('vid');v.srcObject=stream;await v.play();
      det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128']});
      loopNative();
    }else if(window.ZXing){
      const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.CODE_128]);
      const reader=new ZXing.BrowserMultiFormatReader(hints,150);
      await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},'vid',r=>{if(r)seen(r.getText());});
    }else throw new Error('nolib');
    say('Câmera aberta — mostre o código de barras.','ok');
    try{navigator.wakeLock&&navigator.wakeLock.request('screen');}catch(e){}
  }catch(e){
    $('start').style.display='';
    say('Não foi possível abrir a câmera. Permita o acesso à câmera para este site.','err');
  }
}
$('start').onclick=startCam;

$('copy').onclick=async()=>{
  const d=new Date().toLocaleDateString('pt-BR');
  let total=0;
  const lines=Object.keys(items).map(c=>{total+=items[c].qty;return `${items[c].name} (${c}): ${items[c].qty}`;});
  const txt=`Contagem ${d}\n${lines.join('\n')}\nTotal: ${total}`;
  try{await navigator.clipboard.writeText(txt);say('Resumo copiado.','ok');}
  catch(e){say(txt,'');}
};
$('reset').onclick=()=>{
  if(!resetArmed){resetArmed=true;$('reset').textContent='Toque de novo para zerar';setTimeout(()=>{resetArmed=false;$('reset').textContent='Zerar contagens';},3000);return;}
  Object.values(items).forEach(i=>i.qty=0); resetArmed=false; $('reset').textContent='Zerar contagens'; save(); render(); say('Contagens zeradas.','ok');
};

load(); render();
if(mem) say('Aviso: este navegador não está salvando a contagem.','err');
</script>
</body>
</html>
